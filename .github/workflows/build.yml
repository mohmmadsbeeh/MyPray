name: Build MyPray iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build MyPray (Release)
        run: |
          xcodebuild build \
            -project MyPray.xcodeproj \
            -scheme MyPray \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package Payload & IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/MyPray.app build/Payload/
          cd build && zip -r MyPray.ipa Payload/
          cd ..
          ls -lh build/MyPray.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPray-iOS-App
          path: build/MyPray.ipa
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: MyPray Build #${{ github.run_number }}
          body: |
            ### MyPray iOS 17.0+ Build
            - Commit: `${{ github.sha }}`
            - Target: iOS 17.0+
            - Direct download for `MyPray.ipa` below to install via AltStore, Sideloadly, TrollStore, or Xcode Configurator.
          files: build/MyPray.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
