name: Build FivePrayer iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build FivePrayer (Release)
        run: |
          xcodebuild build \
            -project FivePrayer.xcodeproj \
            -scheme FivePrayer \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package Payload & IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/FivePrayer.app build/Payload/
          cd build && zip -r FivePrayer.ipa Payload/
          cd ..
          ls -la build/FivePrayer.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FivePrayer-iOS-App
          path: build/FivePrayer.ipa
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: FivePrayer Build #${{ github.run_number }}
          body: |
            ### FivePrayer iOS 17.0+ Build
            - Commit: `${{ github.sha }}`
            - Target: iOS 17.0+
            - Download `FivePrayer.ipa` below to install via AltStore, Sideloadly, TrollStore, or Xcode Configurator.
          files: build/FivePrayer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
