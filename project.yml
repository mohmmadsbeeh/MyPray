name: MyPray
options:
  bundleIdPrefix: com.mypray
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

packages:
  Adhan:
    url: https://github.com/batoulapps/Adhan-Swift
    from: 1.4.0

targets:
  MyPray:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyPray/MyPray
    dependencies:
      - package: Adhan
      - target: MyPrayWidgetExtension
      - target: MyPrayDeviceActivityMonitor
      - target: MyPrayShieldConfiguration
      - target: MyPrayShieldAction
    settings:
      base:
        PRODUCT_NAME: MyPray
        PRODUCT_BUNDLE_IDENTIFIER: com.mypray.app
        INFOPLIST_FILE: MyPray/MyPray/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyPray/MyPray/MyPray.entitlements
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  MyPrayWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyPray/MyPrayWidgetExtension
      - path: MyPray/MyPray/Core/Storage
      - path: MyPray/MyPray/Core/PrayerEngine
      - path: MyPray/MyPray/Core/Location
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_NAME: MyPrayWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.mypray.app.widget
        INFOPLIST_FILE: MyPray/MyPrayWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyPray/MyPrayWidgetExtension/MyPrayWidgetExtension.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  MyPrayDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyPray/MyPrayDeviceActivityMonitor
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeConstants.swift
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_NAME: MyPrayDeviceActivityMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.mypray.app.deviceactivitymonitor
        INFOPLIST_FILE: MyPray/MyPrayDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyPray/MyPrayDeviceActivityMonitor/MyPrayDeviceActivityMonitor.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  MyPrayShieldConfiguration:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyPray/MyPrayShieldConfiguration
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeConstants.swift
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_NAME: MyPrayShieldConfiguration
        PRODUCT_BUNDLE_IDENTIFIER: com.mypray.app.shieldconfiguration
        INFOPLIST_FILE: MyPray/MyPrayShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyPray/MyPrayShieldConfiguration/MyPrayShieldConfiguration.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  MyPrayShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyPray/MyPrayShieldAction
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeConstants.swift
      - path: MyPray/MyPray/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_NAME: MyPrayShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: com.mypray.app.shieldaction
        INFOPLIST_FILE: MyPray/MyPrayShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyPray/MyPrayShieldAction/MyPrayShieldAction.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
