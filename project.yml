name: FivePrayer
options:
  bundleIdPrefix: com.fiveprayer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

packages:
  Adhan:
    url: https://github.com/batoulapps/Adhan-Swift
    from: 1.4.0

targets:
  FivePrayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FivePrayer/FivePrayer
    dependencies:
      - package: Adhan
      - target: FivePrayerWidgetExtension
      - target: PrayerDeviceActivityMonitor
      - target: PrayerShieldConfiguration
      - target: PrayerShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveprayer.app
        INFOPLIST_FILE: FivePrayer/FivePrayer/Info.plist
        CODE_SIGN_ENTITLEMENTS: FivePrayer/FivePrayer/FivePrayer.entitlements
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  FivePrayerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FivePrayer/FivePrayerWidgetExtension
      - path: FivePrayer/FivePrayer/Core/Storage
      - path: FivePrayer/FivePrayer/Core/PrayerEngine
      - path: FivePrayer/FivePrayer/Core/Location
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveprayer.app.widget
        INFOPLIST_FILE: FivePrayer/FivePrayerWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FivePrayer/FivePrayerWidgetExtension/FivePrayerWidgetExtension.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  PrayerDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FivePrayer/PrayerDeviceActivityMonitor
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeConstants.swift
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveprayer.app.deviceactivitymonitor
        INFOPLIST_FILE: FivePrayer/PrayerDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: FivePrayer/PrayerDeviceActivityMonitor/PrayerDeviceActivityMonitor.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  PrayerShieldConfiguration:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FivePrayer/PrayerShieldConfiguration
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeConstants.swift
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveprayer.app.shieldconfiguration
        INFOPLIST_FILE: FivePrayer/PrayerShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: FivePrayer/PrayerShieldConfiguration/PrayerShieldConfiguration.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  PrayerShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FivePrayer/PrayerShieldAction
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeConstants.swift
      - path: FivePrayer/FivePrayer/Core/ScreenTime/ScreenTimeAppGroupBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiveprayer.app.shieldaction
        INFOPLIST_FILE: FivePrayer/PrayerShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: FivePrayer/PrayerShieldAction/PrayerShieldAction.entitlements
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
